site_name: 関数型デザイン - 原則、パターン、実践
site_description: 6つの関数型言語で学ぶデザインパターンの実践ガイド
site_author: Project Team
repo_url: https://github.com/k2works/functional-desgin-ppp
repo_name: functional-desgin-ppp

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - docs/mkdocs/assets/css/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js
  - docs/assets/js/extra.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works/functional-desgin-ppp
      name: GitHub Repository

plugins:
  - search

exclude_docs: |
  wiki

nav:
  - Home: index.md
  - 記事:
      - 概要: article/index.md
      - 多言語統合解説:
          - はじめに: article/all/index.md
          - 第 1 部 基礎原則:
              - 1. 不変性とデータ変換: article/all/01-immutability-and-data-transformation.md
              - 2. 関数合成と高階関数: article/all/02-function-composition.md
              - 3. 多態性の実現方法: article/all/03-polymorphism.md
          - 第 2 部 仕様とテスト:
              - 4. データ検証: article/all/04-data-validation.md
              - 5. プロパティベーステスト: article/all/05-property-based-testing.md
