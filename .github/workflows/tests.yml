      - name: Run Haskell Part 7 Tests
        run: nix develop .#haskell --command bash -c "cd apps/haskell/part7 && cabal update && cabal test"

  # Rust Tests
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
