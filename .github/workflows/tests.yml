name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Elixir Tests
  elixir:
    name: Elixir Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Elixir Part 1 Tests
        run: nix develop .#elixir --command bash -c "cd apps/elixir/part1 && mix deps.get && mix test"

      - name: Run Elixir Part 2 Tests
        run: nix develop .#elixir --command bash -c "cd apps/elixir/part2 && mix deps.get && mix test"

      - name: Run Elixir Part 3 Tests
        run: nix develop .#elixir --command bash -c "cd apps/elixir/part3 && mix deps.get && mix test"

      - name: Run Elixir Part 4 Tests
        run: nix develop .#elixir --command bash -c "cd apps/elixir/part4 && mix deps.get && mix test"

      - name: Run Elixir Part 5 Tests
        run: nix develop .#elixir --command bash -c "cd apps/elixir/part5 && mix deps.get && mix test"

      - name: Run Elixir Part 6 Tests
        run: nix develop .#elixir --command bash -c "cd apps/elixir/part6 && mix deps.get && mix test"

      - name: Run Elixir Part 7 Tests
        run: nix develop .#elixir --command bash -c "cd apps/elixir/part7 && mix deps.get && mix test"

  # Clojure Tests
  clojure:
    name: Clojure Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Clojure Part 1 Tests
        run: nix develop .#clojure --command bash -c "cd apps/clojure/part1 && clj -M:spec"

      - name: Run Clojure Part 2 Tests
        run: nix develop .#clojure --command bash -c "cd apps/clojure/part2 && clj -M:spec"

      - name: Run Clojure Part 3 Tests
        run: nix develop .#clojure --command bash -c "cd apps/clojure/part3 && clj -M:spec"

      - name: Run Clojure Part 4 Tests
        run: nix develop .#clojure --command bash -c "cd apps/clojure/part4 && clj -M:spec"

      - name: Run Clojure Part 5 Tests
        run: nix develop .#clojure --command bash -c "cd apps/clojure/part5 && clj -M:spec"

      - name: Run Clojure Part 6 Tests
        run: nix develop .#clojure --command bash -c "cd apps/clojure/part6 && clj -M:spec"

      - name: Run Clojure Part 7 Tests
        run: nix develop .#clojure --command bash -c "cd apps/clojure/part7 && clj -M:spec"

  # Scala Tests
  scala:
    name: Scala Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Scala Part 1 Tests
        run: nix develop .#scala --command bash -c "cd apps/scala/part1 && sbt test"

      - name: Run Scala Part 2 Tests
        run: nix develop .#scala --command bash -c "cd apps/scala/part2 && sbt test"

      - name: Run Scala Part 3 Tests
        run: nix develop .#scala --command bash -c "cd apps/scala/part3 && sbt test"

      - name: Run Scala Part 6 Tests
        run: nix develop .#scala --command bash -c "cd apps/scala/part6 && sbt test"

      - name: Run Scala Part 7 Tests
        run: nix develop .#scala --command bash -c "cd apps/scala/part7 && sbt test"

  # F# Tests
  fsharp:
